name: CI - Build & Test Microservices

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'

jobs:
  backend-tests:
    name: Spring Boot Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [restaurant-service, order-service]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Create isolated databases
        env:
          PGPASSWORD: password
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -c "CREATE DATABASE restaurant_db;"
          psql -h localhost -U postgres -c "CREATE DATABASE order_db;"

      - name: Run Maven tests
        working-directory: ./${{ matrix.service }}
        run: chmod +x mvnw && ./mvnw test

  frontend-build:
    name: React TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & Build
        working-directory: ./frontend
        run: |
          npm install
          npm run build